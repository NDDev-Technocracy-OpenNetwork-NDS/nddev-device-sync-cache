name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-validation
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  contract:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy
      - name: Restore the Cargo dependency and tool cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: native-contract
          add-job-id-key: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # `just setup` compiles the pinned jsonschema-cli into .tools (no prebuilt release
          # exists); with it restored, cargo install finds the version installed and returns.
          cache-directories: .tools
      - name: Install the pinned quality tools
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/tools@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
        with:
          # cargo-audit 0.22.2, cargo-deny 0.20.2 and cargo-nextest 0.9.149 from checksummed
          # releases instead of compiling them with cargo install in every job.
          capability: rust
      - name: Install the pinned registry validator
        run: just setup
      - name: Validate schemas and registry
        run: just registry-check
      - name: Reject invalid registry content
        run: just registry-test
      - name: Require an append-only journal against the previous main
        run: just journal-check HEAD^1
      - name: Run the STD-0004 native Rust contract
        id: native
        uses: NDDev-Technocracy-Standarts/std-0004-ci-cd-workflows/.github/actions/ci@c192c6adcf22088abf456635de614d42e8fa3f8d # nddev-cicd-v0.6.20
      - name: Require complete native results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.native.outputs.status }}
        run: test "$STATUS" = success
      - name: Run the RustSec advisory audit
        run: cargo audit --deny warnings

  container:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'
      - name: Build and exercise the hardened service container
        run: just container-check "$GITHUB_SHA"

  image:
    # Publish the verified service image for this exact main commit: tag = full commit SHA,
    # SLSA build provenance in the registry, and a receipt with the digest and base images.
    needs: [contract, container]
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push ghcr.io/<owner>/nddev-device-sync-cache:<commit>
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation with the repository
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign in to the GitHub container registry
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the image unless this commit is already published
        id: push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # A rerun must not replace a published tag with a different, non-reproducible build.
          if docker buildx imagetools inspect "$image:$GITHUB_SHA" > /dev/null 2>&1; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$image:$GITHUB_SHA is already published; reusing it"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            docker build \
              --build-arg "NDS_SOURCE_COMMIT=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --tag "$image:$GITHUB_SHA" .
            docker push "$image:$GITHUB_SHA"
          fi
          digest=$(docker buildx imagetools inspect "$image:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Exercise the published image by digest
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker image rm --force "$IMAGE:$GITHUB_SHA" > /dev/null 2>&1 || true
          docker pull --quiet "$IMAGE@$DIGEST"
          name=nds-cache-published
          docker run --detach --name "$name" --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --memory 128m --pids-limit 64 \
            --tmpfs /var/lib/nds-cache:uid=10001,gid=10001,mode=0700,size=64m \
            --env NDS_CACHE_CAPACITY_BYTES=1073741824 --env NDS_CACHE_MAX_OBJECT_BYTES=1048576 \
            --publish 127.0.0.1:8740:8740 "$IMAGE@$DIGEST" > /dev/null
          for _ in {1..50}; do
            docker exec "$name" nddev-device-sync-cache healthcheck && break
            sleep 0.2
          done
          curl --fail --silent --max-time 2 http://127.0.0.1:8740/v1/health \
            | jq -e --arg commit "$GITHUB_SHA" '.status == "ok" and .source_commit == $commit'
          docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE@$DIGEST" > platform.txt
          docker rm --force "$name" > /dev/null
      - name: Attest the build provenance
        id: attest
        if: ${{ steps.push.outputs.reused != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Write the image receipt
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REUSED: ${{ steps.push.outputs.reused }}
          ATTESTATION: ${{ steps.attest.outputs.attestation-url }}
        run: |
          bases=$(grep -oE '^FROM [^ ]+@sha256:[0-9a-f]{64}' Dockerfile | cut -d' ' -f2 \
            | jq -R 'split("@") | {ref: .[0], digest: .[1]}' | jq -s .)
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$GITHUB_SHA" \
            --arg image "$IMAGE" --arg digest "$DIGEST" --arg platform "$(cat platform.txt)" \
            --argjson base_images "$bases" --argjson reused "$REUSED" --arg attestation "$ATTESTATION" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{schema: "nddev-image-receipt/v1", repository: $repository, commit: $commit,
              image: $image, tag: "\($image):\($commit)", reference: "\($image)@\($digest)",
              digest: $digest, platform: $platform, base_images: $base_images,
              reused_existing_tag: $reused, attestation: $attestation, run: $run}' > image-receipt.json
          { echo '```json'; cat image-receipt.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-receipt-${{ github.sha }}
          path: image-receipt.json
          if-no-files-found: error
          retention-days: 90
