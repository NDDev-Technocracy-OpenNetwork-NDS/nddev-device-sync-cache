[package]
name = "nddev-device-sync-cache-client"
version = "0.0.1-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
authors = ["NDDev OpenNetwork"]
homepage = "https://nddev.ai"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-cache"
publish = false

[[bin]]
name = "nds-cache"
path = "src/bin/nds-cache.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "0.9.8", default-features = false, features = ["std", "parse", "serde"] }
tracing = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1.0"
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
sha2 = "0.11.1"
tempfile = "3.27"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nddev-device-sync-adapter-io = { version = "=0.0.1-alpha.4", git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-agent", rev = "383b6a06b8500626cc12307ac4e2ae92f7d43c80" }
rustix = { version = "1.1.5", features = ["fs", "process"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "signal", "time"] }

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"
