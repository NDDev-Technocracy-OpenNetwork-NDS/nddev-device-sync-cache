# Optional separately owned CI build-result store; combine with compose.yaml.
services:
  nddev-device-sync-cache:
    environment:
      NDS_CACHE_BUILD_ROOT: /var/lib/nds-build-cache
      NDS_CACHE_BUILD_CREDENTIALS_FILE: /run/nds-cache-build-credentials.json
      NDS_CACHE_BUILD_CAPACITY_BYTES: ${NDS_CACHE_BUILD_CAPACITY_BYTES:?Set the independent build-store capacity}
      NDS_CACHE_BUILD_MAX_OBJECT_BYTES: ${NDS_CACHE_BUILD_MAX_OBJECT_BYTES:-1073741824}
      NDS_CACHE_BUILD_IDLE_SECONDS: ${NDS_CACHE_BUILD_IDLE_SECONDS:-86400}
    volumes:
      - type: bind
        source: ${NDS_CACHE_BUILD_STORE:?Set the separate owned build store on the admitted volume}
        target: /var/lib/nds-build-cache
        bind:
          create_host_path: false
      - type: bind
        source: ${NDS_CACHE_BUILD_CREDENTIALS:?Set the private credentials file owned by 10001:10001}
        target: /run/nds-cache-build-credentials.json
        read_only: true
        bind:
          create_host_path: false
